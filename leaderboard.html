<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лідерборд — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; padding: 40px; }
    .main-container { max-width: 900px; margin: 0 auto; }
    
    h1 { color: #fff; margin-bottom: 20px; }

    /* Таби періодів */
    .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
    .tab-btn { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; }
    .tab-btn:hover { background: #1f293d; color: #fff; transform: translateY(-2px); }
    .tab-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; box-shadow: 0 4px 15px rgba(31,111,235,0.3); }

    /* Таблиця */
    .table { width: 100%; border-collapse: collapse; background: #121721; border-radius: 12px; overflow: hidden; border: 1px solid #1e2638; }
    .table th, .table td { padding: 16px; text-align: left; border-bottom: 1px solid #1e2638; }
    .table th { color: #8b949e; font-size: 13px; }
    .rank-cell { font-weight: 700; color: #58a6ff; }
    .time-cell { font-family: monospace; font-weight: 600; color: #3fb950; }
  </style>
</head>
<body>

  <div class="main-container">
    <a href="index.html" style="color: #58a6ff; text-decoration: none; margin-bottom: 10px; display: inline-block;">← Повернутися назад</a>
    <h1>Лідерборд</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="loadLeaderboard('today')">Сьогодні</button>
      <button class="tab-btn" onclick="loadLeaderboard('week')">Тиждень</button>
      <button class="tab-btn" onclick="loadLeaderboard('month')">Місяць</button>
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>№</th>
          <th>Модератор</th>
          <th>Сервер</th>
          <th>Час на зміні</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <!-- Дані будуть тут -->
      </tbody>
    </table>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('ugta_current_user')) || { nick: 'Гість', server: '02' };

    function loadLeaderboard(period) {
      // Активуємо кнопку
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';

      // Збираємо дані (тут ми беремо дані нашого користувача)
      const shifts = JSON.parse(localStorage.getItem('ugta_shifts_' + currentUser.nick) || '[]');
      const now = new Date();
      let totalSeconds = 0;

      shifts.forEach(shift => {
        const shiftDate = new Date(shift.date);
        let include = false;

        if (period === 'today') {
          include = shift.date === now.toISOString().split('T')[0];
        } else if (period === 'week') {
          const diff = (now - shiftDate) / (1000 * 60 * 60 * 24);
          include = diff <= 7;
        } else if (period === 'month') {
          include = shiftDate.getMonth() === now.getMonth();
        }

        if (include) totalSeconds += shift.duration_seconds;
      });

      // Відображаємо
      tbody.innerHTML = `
        <tr>
          <td class="rank-cell">1</td>
          <td>${currentUser.nick}</td>
          <td>${currentUser.server}</td>
          <td class="time-cell">${formatTime(totalSeconds)}</td>
        </tr>
      `;
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return `${h} год ${m} хв`;
    }

    // Завантажити за замовчуванням
    loadLeaderboard('today');
  </script>
</body>
</html>
