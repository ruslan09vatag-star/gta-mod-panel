<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лідерборд — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; padding: 15px; }
    .main-container { max-width: 900px; margin: 0 auto; }
    
    .back-link { color: #58a6ff; text-decoration: none; display: inline-block; margin-bottom: 15px; font-weight: 500; font-size: 14px; transition: 0.2s; }
    .back-link:hover { text-decoration: underline; }

    h1 { color: #fff; margin-bottom: 15px; font-size: 22px; font-weight: 700; }

    .controls-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .tabs { display: flex; gap: 6px; width: 100%; }
    .tab-btn { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; font-size: 13px; flex: 1; text-align: center; }
    .tab-btn:hover { background: #1f293d; color: #fff; }
    .tab-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; box-shadow: 0 4px 15px rgba(31,111,235,0.3); }

    .server-select { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; outline: none; width: 100%; }
    .server-select:focus { border-color: #1f6feb; }

    .table-wrapper { width: 100%; overflow-x: auto; background: #121721; border-radius: 12px; border: 1px solid #1e2638; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .table { width: 100%; border-collapse: collapse; min-width: 500px; }
    .table th, .table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #1e2638; font-size: 13px; }
    .table th { color: #8b949e; font-size: 12px; font-weight: 600; background: #161b22; }
    .rank-cell { font-weight: 700; color: #58a6ff; width: 50px; }
    .time-cell { font-family: monospace; font-weight: 600; color: #3fb950; font-size: 14px; }
    
    .server-badge { padding: 3px 8px; border-radius: 6px; border: 1px solid; font-size: 11px; font-weight: 600; display: inline-block; }
    
    .role-badge { font-size: 11px; font-weight: 600; display: block; margin-top: 2px; }
    .empty-row { text-align: center; color: #8b949e; padding: 25px !important; }

    @media(min-width: 768px) {
      body { padding: 40px; }
      h1 { font-size: 26px; margin-bottom: 20px; }
      .controls-container { flex-direction: row; justify-content: space-between; align-items: center; }
      .tabs { width: auto; gap: 10px; }
      .tab-btn { padding: 10px 16px; font-size: 14px; flex: unset; }
      .server-select { width: auto; font-size: 14px; }
      .table th, .table td { padding: 16px 20px; font-size: 14px; }
      .table th { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <a href="index.html" class="back-link">← Повернутися до панелі</a>
    <h1>Лідерборд модераторів</h1>

    <div class="controls-container">
      <div class="tabs">
        <button class="tab-btn active" onclick="setPeriod('today', event)">Сьогодні</button>
        <button class="tab-btn" onclick="setPeriod('week', event)">Тиждень</button>
        <button class="tab-btn" onclick="setPeriod('month', event)">Місяць</button>
      </div>

      <select id="serverFilter" class="server-select" onchange="renderLeaderboard()">
        <option value="all">🌐 З усіх серверів</option>
        <option value="01">Сервер 01</option>
        <option value="02">Сервер 02</option>
        <option value="03">Сервер 03</option>
        <option value="04">Сервер 04</option>
        <option value="05">Сервер 05</option>
        <option value="06">Сервер 06</option>
        <option value="07">Сервер 07</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>№</th>
            <th>Модератор</th>
            <th>Сервер</th>
            <th>Час на зміні</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="4" class="empty-row">Завантаження даних...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { subscribeToShifts, getRoleColor } from './data.js';

    let currentPeriod = 'today';
    let allShiftsData = [];

    window.setPeriod = function(period, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      currentPeriod = period;
      updateLeaderboardUI();
    }

    function getServerBadgeStyle(serverNum) {
      const s = String(serverNum).padStart(2, '0');
      switch(s) {
        case '01': return 'color: #ff922b; background: rgba(255, 146, 43, 0.15); border-color: rgba(255, 146, 43, 0.4);'; // Помаранчевий
        case '02': return 'color: #33b1ff; background: rgba(51, 177, 255, 0.15); border-color: rgba(51, 177, 255, 0.4);'; // Блакитний
        case '03': return 'color: #2fb344; background: rgba(47, 179, 68, 0.15); border-color: rgba(47, 179, 68, 0.4);';   // Зелений
        case '04': return 'color: #9775fa; background: rgba(151, 117, 250, 0.15); border-color: rgba(151, 117, 250, 0.4);'; // Фіолетовий
        case '05': return 'color: #f06595; background: rgba(240, 101, 149, 0.15); border-color: rgba(240, 101, 149, 0.4);'; // Рожевий
        case '06': return 'color: #12b886; background: rgba(18, 184, 134, 0.15); border-color: rgba(18, 184, 134, 0.4);'; // Бірюзовий
        case '07': return 'color: #4dabf7; background: rgba(77, 171, 247, 0.15); border-color: rgba(77, 171, 247, 0.4);'; // Синій
        default: return 'color: #8b949e; background: rgba(139, 148, 158, 0.15); border-color: rgba(139, 148, 158, 0.4);';
      }
    }

    window.renderLeaderboard = function() {
      updateLeaderboardUI();
    }

    function updateLeaderboardUI() {
      const selectedServer = document.getElementById('serverFilter').value;
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];

      const stats = {};

      allShiftsData.forEach(shift => {
        if (!shift.nick) return;

        if (selectedServer !== 'all') {
          const shiftServerClean = String(shift.server || '').replace(/^0+/, '');
          const selectedClean = String(selectedServer).replace(/^0+/, '');
          if (shiftServerClean !== selectedClean) return;
        }

        const shiftDate = new Date(shift.date);
        let match = false;
        if (currentPeriod === 'today') {
          match = (shift.date === todayStr);
        } else if (currentPeriod === 'week') {
          const diffDays = (now - shiftDate) / (1000 * 60 * 60 * 24);
          match = (diffDays >= 0 && diffDays <= 7);
        } else if (currentPeriod === 'month') {
          match = (shiftDate.getMonth() === now.getMonth() && shiftDate.getFullYear() === now.getFullYear());
        }

        if (match) {
          const key = shift.nick.toLowerCase();
          if (!stats[key]) {
            stats[key] = { originalName: shift.nick, time: 0, server: shift.server, role: shift.role || 'Модератор' };
          }
          stats[key].time += (shift.duration_seconds || 0);
          if (shift.role) stats[key].role = shift.role;
        }
      });

      const sortedKeys = Object.keys(stats).sort((a, b) => stats[b].time - stats[a].time);
      const tbody = document.getElementById('leaderboardBody');

      if (sortedKeys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-row">За вибраний період немає завершених змін.</td></tr>`;
        return;
      }

      tbody.innerHTML = sortedKeys.map((key, index) => {
        const userStats = stats[key];
        const sec = userStats.time;
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        const timeFormatted = `${h} год ${m} хв ${s} сек`;
        const roleColor = getRoleColor(userStats.role);
        const serverStyle = getServerBadgeStyle(userStats.server);

        return `
          <tr>
            <td class="rank-cell">#${index + 1}</td>
            <td>
              <b>${userStats.originalName}</b>
              <span class="role-badge" style="color: ${roleColor};">${userStats.role}</span>
            </td>
            <td><span class="server-badge" style="${serverStyle}">Сервер ${userStats.server}</span></td>
            <td class="time-cell">${timeFormatted}</td>
          </tr>
        `;
      }).join('');
    }

    // Автоматичне оновлення лідерборду в реальному часі
    subscribeToShifts((shifts) => {
      allShiftsData = shifts;
      updateLeaderboardUI();
    });
  </script>
</body>
</html>
