<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGTA Moderation Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Стилі залишаються тими ж, що були в попередній версії */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; min-height: 100vh; padding: 24px 40px; }
    .main-wrapper { max-width: 1300px; margin: 0 auto; }
    .page-title { color: #ffffff; font-size: 26px; font-weight: 700; margin-bottom: 24px; }
    .lb-table { width: 100%; border-collapse: collapse; background: #121721; border-radius: 12px; overflow: hidden; border: 1px solid #1e2638; }
    .lb-table th, .lb-table td { padding: 16px 20px; text-align: left; }
    .lb-table th { background: #161b26; color: #8b949e; font-size: 13px; font-weight: 600; }
    .rank-badge { font-weight: 700; width: 30px; display: inline-block; }
    .server-badge { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 40px; clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 50% 100%, 0% 75%); color: #ffffff; font-weight: 900; font-size: 14px; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Кнопки перемикання -->
    <button onclick="switchTab('main')">Панель</button>
    <button onclick="switchTab('leaderboard')">Лідерборд</button>

    <div id="leaderboardSection" style="display:none;">
      <h1 class="page-title">Лідерборд модераторів</h1>
      <!-- Перемикачі періодів -->
      <button onclick="setPeriod('day')">День</button>
      <button onclick="setPeriod('week')">Тиждень</button>
      <button onclick="setPeriod('month')">Місяць</button>
      
      <table class="lb-table">
        <thead><tr><th>#</th><th>Модератор</th><th>Сервер</th><th>Час</th></tr></thead>
        <tbody id="lbTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zhvhkbchztcqorocbngv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35';
    const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allShiftsData = [];
    let currentPeriod = 'day';
    const todayStr = new Date().toISOString().split('T')[0];

    async function fetchShifts() {
      // Завантажуємо зміни разом з даними профілів
      const { data } = await dbClient.from('shifts').select('*, profiles(nick, server)');
      if (data) {
        allShiftsData = data;
        renderLeaderboard();
      }
    }

    function getWeekNumber(d) {
      let date = new Date(d);
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 4 - (date.getDay() || 7));
      return Math.ceil((((date - new Date(date.getFullYear(), 0, 1)) / 86400000) + 1) / 7);
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('lbTableBody');
      const now = new Date();
      const statsMap = {};

      allShiftsData.forEach(shift => {
        // 1. ВИДАЛЕННЯ НЕСПРАВЖНІХ: ігноруємо записи без профілю
        if (!shift.profiles) return;
        
        const shiftDate = new Date(shift.date);
        let include = false;

        // 2. АВТО-СКИДАННЯ: перевірка періоду
        if (currentPeriod === 'day' && shift.date === todayStr) {
          include = true;
        } else if (currentPeriod === 'week' && getWeekNumber(shiftDate) === getWeekNumber(now) && shiftDate.getFullYear() === now.getFullYear()) {
          include = true;
        } else if (currentPeriod === 'month' && shift.date.slice(0, 7) === now.toISOString().slice(0, 7)) {
          include = true;
        }

        if (include) {
          const uid = shift.user_id;
          if (!statsMap[uid]) {
            statsMap[uid] = { nick: shift.profiles.nick, server: shift.profiles.server, totalSec: 0 };
          }
          statsMap[uid].totalSec += shift.duration_seconds;
        }
      });

      const lbArray = Object.values(statsMap).sort((a, b) => b.totalSec - a.totalSec);

      if (lbArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Немає даних за цей період.</td></tr>`;
        return;
      }

      tbody.innerHTML = lbArray.map((item, i) => `
        <tr>
          <td><span class="rank-badge">${i+1}</span></td>
          <td>${item.nick}</td>
          <td>${item.server}</td>
          <td>${Math.floor(item.totalSec/3600)}год ${Math.floor((item.totalSec%3600)/60)}хв</td>
        </tr>
      `).join('');
    }

    function setPeriod(p) { currentPeriod = p; renderLeaderboard(); }
    function switchTab(t) { /* логіка відображення секцій */ }
    
    fetchShifts();
  </script>
</body>
</html>
