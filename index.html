<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGTA Moderation Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #c9d1d9;
      min-height: 100vh;
    }

    /* === ЕКРАН АВТОРИЗАЦІЇ === */
    .auth-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-container {
      background: #121721;
      border: 1px solid #1e2638;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      color: #f0f6fc;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: #6e7681;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #8b949e;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0b0e14;
      border: 1px solid #1e2638;
      border-radius: 8px;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #388bfd;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #1f6feb;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #388bfd;
    }

    #errorMessage {
      color: #f85149;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }

    /* === ДЕШБОРД (ПАНЕЛЬ МОДЕРАЦІЇ) === */
    #dashboardScreen {
      display: none;
      padding: 24px 40px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Верхня шапка */
    .header-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    /* Профіль модератора */
    .user-profile-btn {
      background: #121721;
      border: 1px solid #1e2638;
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .user-name {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
    }

    .role-badge {
      background: #1e263d;
      color: #8b949e;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .server-badge {
      background: #e91e63;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(233, 30, 99, 0.4);
    }

    /* Випадаюче меню Налаштування */
    .profile-dropdown {
      position: absolute;
      top: 115%;
      left: 0;
      background: #121721;
      border: 1px solid #1e2638;
      border-radius: 8px;
      width: 100%;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 100;
      overflow: hidden;
    }

    .profile-dropdown.active {
      display: block;
    }

    .dropdown-item {
      padding: 10px 16px;
      color: #c9d1d9;
      font-size: 14px;
      transition: background 0.2s;
    }

    .dropdown-item:hover {
      background: #1e2638;
      color: #fff;
    }

    /* Кнопки навігації */
    .nav-btn {
      background: #121721;
      border: 1px solid #1e2638;
      border-radius: 20px;
      padding: 8px 18px;
      color: #8b949e;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: #388bfd;
      color: #ffffff;
    }

    /* Головна секція */
    .page-title {
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .status-text {
      font-size: 15px;
      font-weight: 600;
    }

    .status-off { color: #f85149; }
    .status-on { color: #3fb950; }

    .shift-toggle-btn {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .shift-toggle-btn:hover {
      background: #2ea043;
    }

    .shift-toggle-btn.active {
      background: #da3633;
    }

    /* Картки часу */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #121721;
      border: 1px solid #1e2638;
      border-radius: 12px;
      padding: 24px;
    }

    .card-title {
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-date {
      color: #6e7681;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .card-timer {
      font-family: monospace;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .recent-shifts-card {
      background: #121721;
      border: 1px solid #1e2638;
      border-radius: 12px;
      padding: 24px;
    }
  </style>
</head>
<body>

  <!-- 1. ЕКРАН ВХОДУ -->
  <div id="authScreen" class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Авторизація</h1>
        <p>UGTA Moderation Panel</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="accountNumber">Номер акаунта</label>
          <input 
            type="text" 
            id="accountNumber" 
            name="acc_num_field"
            placeholder="Введіть номер акаунта" 
            required 
            autocomplete="off"
          />
        </div>

        <div class="input-group">
          <label for="password">Пароль</label>
          <input 
            type="password" 
            id="password" 
            name="acc_pass_field"
            placeholder="Введіть пароль" 
            required 
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="login-btn">Увійти</button>
        <div id="errorMessage"></div>
      </form>
    </div>
  </div>

  <!-- 2. ГОЛОВНА ПАНЕЛЬ МОДЕРАТОРА -->
  <div id="dashboardScreen">
    
    <!-- Верхня навігація -->
    <div class="header-nav">
      <div class="user-profile-btn" id="profileBtn">
        <span class="user-name" id="userNick">Завантаження...</span>
        <span class="role-badge" id="userRole">S.M</span>
        <span class="server-badge" id="userServer">02</span>

        <!-- Выпадающее меню -->
        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-item" onclick="alert('Розділ налаштувань у розробці')">Налаштування</div>
          <div class="dropdown-item" onclick="logout()" style="color: #f85149;">Вийти</div>
        </div>
      </div>

      <button class="nav-btn">Усі посилання</button>
      <button class="nav-btn">Лідерборд</button>
      <button class="nav-btn">Посібник</button>
      <button class="nav-btn">Гра</button>
    </div>

    <!-- Заголовок і статус -->
    <h1 class="page-title">Панель модерації</h1>

    <div class="status-bar">
      <div class="status-text">
        Статус: <span id="statusIndicator" class="status-off">Не на зміні</span>
      </div>
      <button class="shift-toggle-btn" id="shiftBtn" onclick="toggleShift()">Почати зміну</button>
    </div>

    <!-- Картки статистики часу -->
    <div class="cards-grid">
      <div class="card">
        <div class="card-title">Сьогодні</div>
        <div class="card-date" id="todayDate">2026-08-11</div>
        <div class="card-timer" id="todayTimer">00:00:00</div>
      </div>

      <div class="card">
        <div class="card-title">Вчора</div>
        <div class="card-date" id="yesterdayDate">2026-08-10</div>
        <div class="card-timer">00:00:00</div>
      </div>
    </div>

    <!-- Останні зміни -->
    <div class="recent-shifts-card">
      <div class="card-title">Останні зміни</div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://zhvhkbchztcqorocbngv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isOnShift = false;
    let timerInterval = null;
    let totalSeconds = 0;

    // Встановити поточні дати
    document.getElementById('todayDate').textContent = new Date().toISOString().split('T')[0];
    const yDay = new Date();
    yDay.setDate(yDay.getDate() - 1);
    document.getElementById('yesterdayDate').textContent = yDay.toISOString().split('T')[0];

    // Перевірка активної сесії при відкритті
    window.addEventListener('DOMContentLoaded', () => {
      const session = localStorage.getItem('userSession');
      if (session) {
        showDashboard(JSON.parse(session));
      }
    });

    // Обробка форми Входу
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const accountNumber = document.getElementById('accountNumber').value.trim();
      const password = document.getElementById('password').value.trim();

      const { data: user, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('account_number', accountNumber)
        .eq('password', password)
        .maybeSingle();

      if (error || !user) {
        const errDiv = document.getElementById('errorMessage');
        errDiv.textContent = '❌ Невірний номер акаунта або пароль!';
        errDiv.style.display = 'block';
        return;
      }

      localStorage.setItem('userSession', JSON.stringify(user));
      showDashboard(user);
    });

    // Показ Панелі модератора
    function showDashboard(user) {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';

      document.getElementById('userNick').textContent = user.nick || 'Модератор';
      document.getElementById('userRole').textContent = user.role || 'S.M';
      document.getElementById('userServer').textContent = user.server || '02';
    }

    // Випадаюче меню профілю
    document.getElementById('profileBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('active');
    });

    document.addEventListener('click', () => {
      document.getElementById('profileDropdown').classList.remove('active');
    });

    // Початок / Завершення зміни
    function toggleShift() {
      const statusInd = document.getElementById('statusIndicator');
      const shiftBtn = document.getElementById('shiftBtn');

      isOnShift = !isOnShift;

      if (isOnShift) {
        statusInd.textContent = 'На зміні';
        statusInd.className = 'status-on';
        shiftBtn.textContent = 'Завершити зміну';
        shiftBtn.classList.add('active');

        // Запуск таймера
        timerInterval = setInterval(() => {
          totalSeconds++;
          const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
          const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
          const secs = String(totalSeconds % 60).padStart(2, '0');
          document.getElementById('todayTimer').textContent = `${hrs}:${mins}:${secs}`;
        }, 1000);

      } else {
        statusInd.textContent = 'Не на зміні';
        statusInd.className = 'status-off';
        shiftBtn.textContent = 'Почати зміну';
        shiftBtn.classList.remove('active');
        clearInterval(timerInterval);
      }
    }

    // Вихід з акаунта
    function logout() {
      localStorage.removeItem('userSession');
      location.reload();
    }
  </script>
</body>
</html>
