<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель модерації — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; padding: 20px; }
    .main-container { max-width: 1000px; margin: 0 auto; }
    
    /* Шапка профілю та меню */
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #121721; padding: 15px 20px; border-radius: 12px; border: 1px solid #1e2638; flex-wrap: wrap; gap: 15px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: #21262d; border: 1px solid #30363d; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
    .nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-btn { background: #161b22; border: 1px solid #30363d; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.2s; }
    .nav-btn:hover { background: #1f293d; }
    .nav-btn.active { background: #1f6feb; border-color: #1f6feb; }
    .nav-btn.logout { background: rgba(248, 81, 73, 0.15); border-color: rgba(248, 81, 73, 0.4); color: #f85149; }

    h1 { color: #fff; font-size: 24px; font-weight: 700; margin-bottom: 20px; }

    /* Головна картка зміни */
    .shift-card { background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .shift-status-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .status-text { font-size: 15px; font-weight: 600; }
    .status-off { color: #f85149; }
    .status-on { color: #3fb950; }
    
    .action-btn { background: #238636; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .action-btn:hover { background: #2ea043; }
    .action-btn.end { background: #da3633; }
    .action-btn.end:hover { background: #f85149; }

    /* Картки статистики (Сьогодні / Вчора) */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-box { background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 20px; }
    .stat-box-title { color: #8b949e; font-size: 13px; margin-bottom: 5px; }
    .stat-box-date { color: #8b949e; font-size: 11px; margin-bottom: 12px; }
    .stat-box-time { font-family: monospace; font-size: 28px; font-weight: 700; color: #fff; }

    /* Історія змін */
    .section-title { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 15px; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: #121721; border: 1px solid #1e2638; border-radius: 8px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .history-date { color: #8b949e; }
    .history-duration { font-family: monospace; color: #3fb950; font-weight: 600; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Шапка з кнопками -->
    <div class="top-header">
      <div class="user-info">
        <div class="user-avatar" id="userInitial">Р</div>
        <div>
          <div style="color: #fff; font-weight: 700; font-size: 15px;" id="userName">Руслан Мандарин</div>
          <div style="color: #8b949e; font-size: 12px;" id="userRoleServer">S.M • Сервер 02</div>
        </div>
      </div>

      <div class="nav-buttons">
        <a href="index.html" class="nav-btn active">Панель</a>
        <a href="admin.html" class="nav-btn">Керівництво</a>
        <a href="leaderboard.html" class="nav-btn">Лідерборд 🏆</a>
        <a href="#" class="nav-btn logout" onclick="logout()">Вийти</a>
      </div>
    </div>

    <h1>Панель модерації</h1>

    <!-- Блок зміни -->
    <div class="shift-card">
      <div class="shift-status-row">
        <div class="status-text">Статус: <span id="shiftStatus" class="status-off">Не на зміні</span></div>
        <button id="shiftBtn" class="action-btn" onclick="toggleShift()">Почати зміну</button>
      </div>
    </div>

    <!-- Час за сьогодні / вчора -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-title">Сьогодні</div>
        <div class="stat-box-date" id="todayDateStr">--.--.----</div>
        <div class="stat-box-time" id="todayTime">00:00:00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-title">Вчора</div>
        <div class="stat-box-date" id="yesterdayDateStr">--.--.----</div>
        <div class="stat-box-time" id="yesterdayTime">00:00:00</div>
      </div>
    </div>

    <div class="section-title">Останні зміни</div>
    <div class="history-list" id="historyList">
      <div class="history-item"><span class="history-date">Завантаження історії...</span></div>
    </div>
  </div>

  <script type="module">
    import { subscribeToShifts, saveShift } from './data.js';

    let isOnDuty = false;
    let shiftStartTime = null;
    let timerInterval = null;
    let secondsToday = 0;
    let secondsYesterday = 0;

    // Дати для сьогодні та вчора
    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const yesterdayDate = new Date();
    yesterdayDate.setDate(now.getDate() - 1);
    const yesterdayStr = yesterdayDate.toISOString().split('T')[0];

    document.getElementById('todayDateStr').innerText = todayStr;
    document.getElementById('yesterdayDateStr').innerText = yesterdayStr;

    window.toggleShift = function() {
      if (!isOnDuty) {
        // Почати зміну
        isOnDuty = true;
        shiftStartTime = new Date();
        document.getElementById('shiftStatus').innerText = "На зміні";
        document.getElementById('shiftStatusclassName').className = "status-text status-on";
        
        const btn = document.getElementById('shiftBtn');
        btn.innerText = "Закінчити зміну";
        btn.className = "action-btn end";

        // Запуск таймера поточної зміни
        timerInterval = setInterval(() => {
          secondsToday++;
          updateDisplayTimes();
        }, 1000);

      } else {
        // Закінчити зміну
        clearInterval(timerInterval);
        isOnDuty = false;
        document.getElementById('shiftStatus').innerText = "Не на зміні";
        document.getElementById('shiftStatus').className = "status-text status-off";
        
        const btn = document.getElementById('shiftBtn');
        btn.innerText = "Почати зміну";
        btn.className = "action-btn";

        // Зберігаємо зміну в базу даних
        const durationSec = 10; // тестові або реальні секунди
        saveShift({
          nick: "Руслан Мандарин",
          role: "S.M",
          server: "02",
          date: todayStr,
          start_time: shiftStartTime.toLocaleTimeString(),
          duration_seconds: secondsToday,
          duration: `${Math.floor(secondsToday/3600)} год ${Math.floor((secondsToday%3600)/60)} хв`,
          status: "Completed"
        });
      }
    }

    function updateDisplayTimes() {
      const h = String(Math.floor(secondsToday / 3600)).padStart(2, '0');
      const m = String(Math.floor((secondsToday % 3600) / 60)).padStart(2, '0');
      const s = String(secondsToday % 60).padStart(2, '0');
      document.getElementById('todayTime').innerText = `${h}:${m}:${s}`;
    }

    window.logout = function() {
      alert("Ви вийшли з аккаунту");
    }

    // Слухаємо зміни з бази даних
    subscribeToShifts((shifts) => {
      const historyList = document.getElementById('historyList');
      const myShifts = shifts.filter(s => s.nick && s.nick.toLowerCase() === "руслан мандарин");

      if (myShifts.length === 0) {
        historyList.innerHTML = `<div class="history-item"><span class="history-date">Немає збережених змін.</span></div>`;
        return;
      }

      historyList.innerHTML = myShifts.slice(-5).reverse().map(s => `
        <div class="history-item">
          <span class="history-date">Дата: ${s.date} о ${s.start_time || ''}</span>
          <span class="history-duration">${s.duration || '0 год 0 хв'}</span>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
