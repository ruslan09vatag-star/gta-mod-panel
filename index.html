<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель модератора — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; min-height: 100vh; padding: 15px; }
    .main-container { max-width: 1000px; margin: 0 auto; }

    /* Шапка */
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 45px; height: 45px; border-radius: 10px; background: #1f6feb; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; }
    .user-details .name { color: #fff; font-size: 16px; font-weight: 600; }
    .user-details .role { color: #8b949e; font-size: 12px; }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn { border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-admin { background: #8957e5; color: #fff; display: none; } /* Приховано за замовчуванням для звичайних модераторів */
    .btn-admin:hover { background: #6e40c9; }
    .btn-logout { background: #da3633; color: #fff; }
    .btn-logout:hover { background: #e5534b; }

    /* Основна картка зміни */
    .shift-card { background: #121721; border: 1px solid #1e2638; border-radius: 14px; padding: 30px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); margin-bottom: 25px; }
    .shift-title { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .shift-status { font-size: 14px; margin-bottom: 20px; color: #8b949e; }
    .shift-status.active { color: #3fb950; font-weight: 600; }
    
    .timer-display { font-size: 42px; font-weight: 700; font-family: monospace; color: #fff; margin-bottom: 25px; }

    .btn-shift { padding: 12px 30px; font-size: 16px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; color: #fff; }
    .btn-start { background: #238636; }
    .btn-start:hover { background: #2ea043; }
    .btn-end { background: #da3633; }
    .btn-end:hover { background: #e5534b; }

    @media(min-width: 768px) { body { padding: 30px; } }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Шапка панелі -->
    <div class="top-header">
      <div class="user-info">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-details">
          <div class="name" id="userName">Користувач</div>
          <div class="role" id="userRole">Модератор</div>
        </div>
      </div>
      <div class="header-actions">
        <!-- Кнопка панелі керівництва (доступна лише старшим рангам) -->
        <a href="admin.html" class="btn btn-admin" id="adminPanelBtn">🛡️ Керівництво</a>
        <button class="btn btn-logout" onclick="logout()">Вийти</button>
      </div>
    </div>

    <!-- Блок керування зміною -->
    <div class="shift-card">
      <div class="shift-title">Облік робочої зміни</div>
      <div class="shift-status" id="shiftStatusText">Зміна не розпочата</div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      
      <button class="btn-shift btn-start" id="shiftToggleBtn" onclick="toggleShift()">Почати зміну</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { saveShift } from './data.js';

    const dbClient = supabase.createClient('https://zhvhkbchztcqorocbngv.supabase.co', 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35');

    // Перевірка авторизації
    let currentUser = JSON.parse(localStorage.getItem('ugta_current_user') || 'null');
    if (!currentUser) {
      window.location.href = 'login.html';
    }

    const nick = currentUser.nick || currentUser.name || 'Модератор';
    const role = currentUser.role || currentUser.status || 'Модератор';

    // Відображення даних користувача в шапці
    document.getElementById('userName').textContent = nick;
    document.getElementById('userRole').textContent = role;

    const avatarUrl = localStorage.getItem('ugta_avatar_' + nick) || currentUser.avatar;
    if (avatarUrl) {
      const avBlock = document.getElementById('userAvatar');
      avBlock.style.backgroundImage = `url('${avatarUrl}')`;
      avBlock.textContent = '';
    } else {
      document.getElementById('userAvatar').textContent = nick.charAt(0).toUpperCase();
    }

    // Перевірка прав доступу для кнопки «Керівництво»
    const roleLower = role.toLowerCase();
    const allowedRoles = ['адміністратор', 'властитель', 'засновник', 'куратор', 'керівник', 'адмін', 'старший модератор'];
    const hasAdminAccess = allowedRoles.some(r => roleLower.includes(r));

    if (hasAdminAccess) {
      document.getElementById('adminPanelBtn').style.display = 'inline-flex';
    }

    // Логіка роботи зміни
    let isOnDuty = localStorage.getItem('ugta_is_on_duty_' + nick) === 'true';
    let startTime = parseInt(localStorage.getItem('ugta_shift_start_' + nick) || '0');
    let timerInterval = null;

    const statusText = document.getElementById('shiftStatusText');
    const timerDisplay = document.getElementById('timerDisplay');
    const toggleBtn = document.getElementById('shiftToggleBtn');

    function updateUI() {
      if (isOnDuty) {
        statusText.textContent = "Зміна активна (ви на роботі)";
        statusText.className = "shift-status active";
        toggleBtn.textContent = "Завершити зміну";
        toggleBtn.className = "btn-shift btn-end";
      } else {
        statusText.textContent = "Зміна не розпочата";
        statusText.className = "shift-status";
        toggleBtn.textContent = "Почати зміну";
        toggleBtn.className = "btn-shift btn-start";
        timerDisplay.textContent = "00:00:00";
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const diffSecs = Math.floor((Date.now() - startTime) / 1000);
        const h = Math.floor(diffSecs / 3600);
        const m = Math.floor((diffSecs % 3600) / 60);
        const s = diffSecs % 60;
        timerDisplay.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }, 1000);
    }

    if (isOnDuty && startTime > 0) {
      updateUI();
      startTimer();
    }

    window.toggleShift = async function() {
      if (!isOnDuty) {
        // Початок зміни
        isOnDuty = true;
        startTime = Date.now();
        localStorage.setItem('ugta_is_on_duty_' + nick, 'true');
        localStorage.setItem('ugta_shift_start_' + nick, startTime);

        // Оновлюємо статус в базі Supabase, щоб панель керівництва бачила модератора онлайн
        await dbClient.from('profiles').update({ 
          is_on_duty: true, 
          shift_start: startTime 
        }).eq('nick', nick);

        updateUI();
        startTimer();
      } else {
        // Завершення зміни
        const endTime = Date.now();
        const durationSeconds = Math.floor((endTime - startTime) / 1000);

        if (durationSeconds > 10) { // Зберігаємо тільки змінні довші за 10 секунд
          try {
            await saveShift({
              nick: nick,
              server: currentUser.server || '02',
              start_time: new Date(startTime).toISOString(),
              end_time: new Date(endTime).toISOString(),
              duration_seconds: durationSeconds
            });
          } catch (err) {
            console.error("Помилка збереження зміни:", err);
          }
        }

        isOnDuty = false;
        clearInterval(timerInterval);
        localStorage.removeItem('ugta_is_on_duty_' + nick);
        localStorage.removeItem('ugta_shift_start_' + nick);

        // Очищаємо статус онлайн в базі Supabase
        await dbClient.from('profiles').update({ 
          is_on_duty: false, 
          shift_start: null 
        }).eq('nick', nick);

        updateUI();
        alert("Зміну успішно завершено та збережено!");
      }
    }

    window.logout = function() {
      if (isOnDuty) {
        alert("Будь ласка, спочатку завершіть зміну перед виходом з акаунта!");
        return;
      }
      localStorage.removeItem('ugta_current_user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
