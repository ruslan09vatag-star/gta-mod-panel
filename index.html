<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGTA Moderation — Вхід</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      color: #f0f6fc;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: #8b949e;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #8b949e;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-group input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #238636;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #2ea043;
    }

    #errorMessage {
      color: #f85149;
      font-size: 13px;
      text-align: center;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Авторизація</h1>
      <p>UGTA Moderation Panel</p>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="input-group">
        <label for="accountNumber">Номер акаунта</label>
        <input 
          type="text" 
          id="accountNumber" 
          name="account_num_field"
          placeholder="Введіть номер акаунта" 
          required 
          autocomplete="off"
        />
      </div>

      <div class="input-group">
        <label for="password">Пароль</label>
        <input 
          type="password" 
          id="password" 
          name="account_pass_field"
          placeholder="Введіть пароль" 
          required 
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Увійти</button>
      <div id="errorMessage"></div>
    </form>
  </div>

  <script>
    // 🔑 ВСТАВ СВІЙ СТРАВЖНІЙ КЛЮЧ АНОНІМНОСТІ ВІД SUPABASE СЮДИ:
    const SUPABASE_URL = 'https://zhvhkbchztcqorocbngv.supabase.co';
    const SUPABASE_KEY = 'ТВІЙ_ANON_KEY_З_SUPABASE'; 

    let supabase;

    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (err) {
      console.error('Помилка ініціалізації Supabase:', err);
    }

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.style.display = 'none';

      if (!supabase || SUPABASE_KEY.includes('ТВІЙ_ANON_KEY')) {
        showError('❌ Вкажіть правильний SUPABASE_KEY у коді!');
        return;
      }

      const accountNumber = document.getElementById('accountNumber').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const { data: user, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('account_number', accountNumber)
          .eq('password', password)
          .maybeSingle();

        if (error) {
          console.error('Помилка Supabase:', error);
          showError('❌ Помилка з\'єднання з базою даних.');
          return;
        }

        if (!user) {
          showError('❌ Невірний номер акаунта або пароль!');
          return;
        }

        localStorage.setItem('userSession', JSON.stringify(user));
        alert(`Вітаємо, ${user.nick || 'модератор'}!`);

      } catch (err) {
        console.error(err);
        showError('❌ Виникла помилка під час входу.');
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.style.display = 'block';
    }
  </script>
</body>
</html>
