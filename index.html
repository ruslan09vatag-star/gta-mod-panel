<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель модерації — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; min-height: 100vh; padding: 20px 40px; }
    .main-container { max-width: 1200px; margin: 0 auto; }

    /* Верхня панель */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #121721; border: 1px solid #1e2638; padding: 14px 24px; border-radius: 14px; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .user-info { display: flex; align-items: center; gap: 14px; }
    
    .user-avatar { background: linear-gradient(135deg, #1f6feb, #1158c7); color: #fff; font-weight: 700; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 20px; box-shadow: 0 2px 10px rgba(31,111,235,0.3); }
    
    .user-details { display: flex; flex-direction: column; gap: 3px; }
    .user-name { font-weight: 600; color: #fff; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    
    .user-role-badge { background: #1f293d; color: #58a6ff; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; border: 1px solid #30363d; display: inline-block; width: fit-content; }
    
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-btn { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .logout-btn { background: #da3633 !important; border-color: #f85149 !important; }

    h1 { color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 20px; }
    
    /* Статус та кнопка */
    .status-card { background: #121721; border: 1px solid #1e2638; padding: 24px; border-radius: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .status-text { font-size: 16px; font-weight: 500; }
    .status-badge { font-weight: 700; }
    .status-badge.off { color: #f85149; }
    .status-badge.on { color: #3fb950; }

    .action-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; color: #fff; }
    .btn-start { background-color: #238636; }
    .btn-start:hover { background-color: #2ea043; }
    .btn-end { background-color: #da3633; }
    .btn-end:hover { background-color: #e5534b; }

    /* Статистика */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .stat-box { background: #121721; border: 1px solid #1e2638; padding: 24px; border-radius: 12px; }
    .stat-title { color: #8b949e; font-size: 14px; margin-bottom: 8px; }
    .stat-date { color: #8b949e; font-size: 12px; margin-bottom: 12px; }
    .stat-time { font-size: 28px; font-weight: 700; color: #fff; font-family: monospace; }

    /* Останні зміни */
    .section-title { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 14px; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: #121721; border: 1px solid #1e2638; padding: 16px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .history-date { color: #8b949e; font-size: 13px; }
    .history-duration { font-weight: 600; color: #3fb950; font-family: monospace; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="top-bar">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">Р</div>
        <div class="user-details">
          <div class="user-name" id="userName">Завантаження...</div>
          <div class="user-role-badge" id="userRoleBadge">Модератор • Сервер 02</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-btn active">Панель</a>
        <a href="#" class="nav-btn" onclick="alert('Розділ у розробці')">Лідерборд</a>
        <a href="#" class="nav-btn logout-btn" onclick="logout()">Вийти</a>
      </div>
    </div>

    <h1>Панель модерації</h1>

    <div class="status-card">
      <div class="status-text">
        Статус: <span id="statusBadge" class="status-badge off">Не на зміні</span>
      </div>
      <button id="shiftToggleBtn" class="action-btn btn-start" onclick="toggleShift()">Почати зміну</button>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-title">Сьогодні</div>
        <div class="stat-date" id="todayDate">----.--.--</div>
        <div class="stat-time" id="todayTime">00:00:00</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Вчора</div>
        <div class="stat-date" id="yesterdayDate">----.--.--</div>
        <div class="stat-time" id="yesterdayTime">00:00:00</div>
      </div>
    </div>

    <div class="section-title">Останні зміни</div>
    <div class="history-list" id="historyList">
      <div style="color: #8b949e; font-size: 14px;">Ще немає завершених змін.</div>
    </div>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('ugta_current_user'));
    if (!currentUser) {
      window.location.href = 'login.html';
    }

    const nick = currentUser.nick || 'Модератор';
    const server = currentUser.server || '02';

    document.getElementById('userName').textContent = nick;
    document.getElementById('userAvatar').textContent = nick.charAt(0).toUpperCase();
    document.getElementById('userRoleBadge').textContent = `Модератор • Сервер ${server}`;

    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];

    document.getElementById('todayDate').textContent = todayStr;
    document.getElementById('yesterdayDate').textContent = yesterdayStr;

    // Виправлено ключ збереження стану зміни
    let isOnDuty = localStorage.getItem('ugta_is_on_duty_' + nick) === 'true';
    let shiftStartTime = parseInt(localStorage.getItem('ugta_shift_start_' + nick) || '0');

    const statusBadge = document.getElementById('statusBadge');
    const shiftToggleBtn = document.getElementById('shiftToggleBtn');

    function updateShiftUI() {
      if (isOnDuty) {
        statusBadge.textContent = 'На зміні';
        statusBadge.className = 'status-badge on';
        shiftToggleBtn.textContent = 'Закінчити зміну';
        shiftToggleBtn.className = 'action-btn btn-end';
      } else {
        statusBadge.textContent = 'Не на зміні';
        statusBadge.className = 'status-badge off';
        shiftToggleBtn.textContent = 'Почати зміну';
        shiftToggleBtn.className = 'action-btn btn-start';
      }
    }
    updateShiftUI();

    function toggleShift() {
      const currentTime = Date.now();

      if (!isOnDuty) {
        isOnDuty = true;
        shiftStartTime = currentTime;
        localStorage.setItem('ugta_is_on_duty_' + nick, 'true');
        localStorage.setItem('ugta_shift_start_' + nick, shiftStartTime);
        updateShiftUI();
      } else {
        const durationSec = Math.max(1, Math.floor((currentTime - shiftStartTime) / 1000));
        
        let shifts = JSON.parse(localStorage.getItem('ugta_shifts_' + nick) || '[]');
        
        shifts.unshift({
          date: todayStr,
          duration_seconds: durationSec
        });

        localStorage.setItem('ugta_shifts_' + nick, JSON.stringify(shifts));

        isOnDuty = false;
        localStorage.removeItem('ugta_is_on_duty_' + nick);
        localStorage.removeItem('ugta_shift_start_' + nick);
        updateShiftUI();
        loadShiftsHistory();
      }
    }

    function loadShiftsHistory() {
      const shifts = JSON.parse(localStorage.getItem('ugta_shifts_' + nick) || '[]');
      const historyList = document.getElementById('historyList');

      if (shifts.length === 0) {
        historyList.innerHTML = `<div style="color: #8b949e; font-size: 14px;">Ще немає завершених змін.</div>`;
      } else {
        historyList.innerHTML = shifts.slice(0, 10).map(shift => {
          const hours = Math.floor(shift.duration_seconds / 3600);
          const minutes = Math.floor((shift.duration_seconds % 3600) / 60);
          const seconds = shift.duration_seconds % 60;
          const timeFormatted = `${hours} год ${minutes} хв ${seconds} сек`;

          return `
            <div class="history-item">
              <span class="history-date">Дата: <b>${shift.date}</b></span>
              <span class="history-duration">Період: ${timeFormatted}</span>
            </div>
          `;
        }).join('');
      }

      let todayTotalSec = 0;
      let yesterdayTotalSec = 0;

      shifts.forEach(shift => {
        if (shift.date === todayStr) todayTotalSec += shift.duration_seconds;
        if (shift.date === yesterdayStr) yesterdayTotalSec += shift.duration_seconds;
      });

      if (isOnDuty && shiftStartTime > 0) {
        const activeSeconds = Math.floor((Date.now() - shiftStartTime) / 1000);
        todayTotalSec += activeSeconds;
      }

      document.getElementById('todayTime').textContent = formatTime(todayTotalSec);
      document.getElementById('yesterdayTime').textContent = formatTime(yesterdayTotalSec);
    }

    function formatTime(totalSec) {
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    loadShiftsHistory();

    setInterval(() => {
      if (isOnDuty) {
        loadShiftsHistory();
      }
    }, 1000);
  </script>
</body>
</html>
