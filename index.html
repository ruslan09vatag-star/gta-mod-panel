<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGTA Moderation Panel</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; min-height: 100vh; padding: 24px 40px; }
    .main-wrapper { max-width: 1300px; margin: 0 auto; }

    .server-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 40px; clip-path: polygon(0% 0%, 100% 0%, 100% 75%, 50% 100%, 0% 75%);
      color: #ffffff; font-weight: 900; font-size: 16px; letter-spacing: -1px; user-select: none; vertical-align: middle;
    }

    .header-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
    .user-profile-btn { background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; user-select: none; }
    .user-name { color: #ffffff; font-weight: 700; font-size: 15px; }

    .role-badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }
    .role-moderator { background: #1e263d; color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.3); }
    .role-sm { background: #1e2e1e; color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.4); }
    .role-zktp { background: #3d2b1e; color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
    .role-ktp { background: #3d1e1e; color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }

    .profile-dropdown { position: absolute; top: 115%; left: 0; background: #121721; border: 1px solid #1e2638; border-radius: 8px; width: 100%; display: none; box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 100; overflow: hidden; }
    .profile-dropdown.active { display: block; }
    .dropdown-item { padding: 10px 16px; color: #c9d1d9; font-size: 14px; transition: background 0.2s; }
    .dropdown-item:hover { background: #1e2638; color: #fff; }

    .nav-btn { background: #121721; border: 1px solid #1e2638; border-radius: 20px; padding: 8px 18px; color: #8b949e; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { border-color: #388bfd; color: #ffffff; background: #1e2638; }

    .page-title { color: #ffffff; font-size: 26px; font-weight: 700; margin-bottom: 24px; }
    .status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .status-text { font-size: 15px; font-weight: 600; }
    .status-off { color: #f85149; }
    .status-on { color: #3fb950; }

    .shift-toggle-btn { background: #238636; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .shift-toggle-btn:hover { background: #2ea043; }
    .shift-toggle-btn.active { background: #da3633; }

    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .card { background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 24px; }
    .card-title { color: #ffffff; font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .card-date { color: #6e7681; font-size: 13px; margin-bottom: 24px; }
    .card-timer { font-family: monospace; font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: 2px; }

    .recent-shifts-card { background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 24px; margin-bottom: 30px; }
    .shifts-list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .shift-item { display: flex; justify-content: space-between; align-items: center; background: #0b0e14; padding: 12px 16px; border-radius: 8px; border: 1px solid #1e2638; font-size: 14px; }
    .shift-time { color: #8b949e; font-size: 13px; }
    .shift-duration { color: #3fb950; font-weight: 600; font-family: monospace; }

    #leaderboardSection { display: none; }
    .lb-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }

    .sliding-toggle { position: relative; background: #121721; border: 1px solid #1e2638; border-radius: 30px; padding: 4px; display: flex; width: 320px; }
    .slider-pill { position: absolute; top: 4px; bottom: 4px; width: calc(33.33% - 4px); background: #1f6feb; border-radius: 25px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
    .toggle-btn { flex: 1; background: transparent; border: none; color: #8b949e; font-weight: 600; font-size: 13px; padding: 8px 0; cursor: pointer; z-index: 2; transition: color 0.2s; }
    .toggle-btn.active { color: #ffffff; }

    .server-filter-btn { background: #121721; border: 1px solid #1e2638; color: #8b949e; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .server-filter-btn.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }

    .lb-table { width: 100%; border-collapse: collapse; background: #121721; border-radius: 12px; overflow: hidden; border: 1px solid #1e2638; }
    .lb-table th, .lb-table td { padding: 16px 20px; text-align: left; }
    .lb-table th { background: #161b26; color: #8b949e; font-size: 13px; font-weight: 600; border-bottom: 1px solid #1e2638; }
    .lb-table tr { border-bottom: 1px solid #1e2638; transition: background 0.2s; }
    .lb-table tr:hover { background: #1a202c; }
    .rank-badge { font-weight: 700; width: 30px; display: inline-block; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header-nav">
      <div class="user-profile-btn" id="profileBtn">
        <span class="user-name" id="userNick">Завантаження...</span>
        <span class="role-badge" id="userRole">S.M</span>
        <span id="userServerContainer"></span>

        <div class="profile-dropdown" id="profileDropdown">
          <div class="dropdown-item" onclick="alert('Розділ налаштувань у розробці')">Налаштування</div>
          <div class="dropdown-item" onclick="logout()" style="color: #f85149;">Вийти</div>
        </div>
      </div>

      <button class="nav-btn active" id="btnMain" onclick="switchTab('main')">Панель</button>
      <button class="nav-btn" id="btnLeaderboard" onclick="switchTab('leaderboard')">Лідерборд</button>
      <button class="nav-btn" onclick="alert('Посібник у розробці')">Посібник</button>
      <button class="nav-btn" onclick="alert('Запуск гри...')">Гра</button>
    </div>

    <!-- ОСНОВНИЙ РОЗДІЛ МОДЕРАЦІЇ -->
    <div id="mainSection">
      <h1 class="page-title">Панель модерації</h1>

      <div class="status-bar">
        <div class="status-text">
          Статус: <span id="statusIndicator" class="status-off">Не на зміні</span>
        </div>
        <button class="shift-toggle-btn" id="shiftBtn" onclick="toggleShift()">Почати зміну</button>
      </div>

      <div class="cards-grid">
        <div class="card">
          <div class="card-title">Сьогодні</div>
          <div class="card-date" id="todayDate">2026-08-11</div>
          <div class="card-timer" id="todayTimer">00:00:00</div>
        </div>

        <div class="card">
          <div class="card-title">Вчора</div>
          <div class="card-date" id="yesterdayDate">2026-08-10</div>
          <div class="card-timer" id="yesterdayTimer">00:00:00</div>
        </div>
      </div>

      <div class="recent-shifts-card">
        <div class="card-title">Останні зміни</div>
        <div class="shifts-list" id="shiftsList">
          <div style="color: #6e7681; font-size: 13px;">Немає завершених змін.</div>
        </div>
      </div>
    </div>

    <!-- РОЗДІЛ ЛІДЕРБОРДУ -->
    <div id="leaderboardSection">
      <h1 class="page-title">Лідерборд модераторів</h1>

      <div class="lb-controls">
        <div class="sliding-toggle">
          <div class="slider-pill" id="sliderPill"></div>
          <button class="toggle-btn active" onclick="setPeriod(0, 'day')">День</button>
          <button class="toggle-btn" onclick="setPeriod(1, 'week')">Тиждень</button>
          <button class="toggle-btn" onclick="setPeriod(2, 'month')">Місяць</button>
        </div>

        <div>
          <button class="server-filter-btn active" id="filterAll" onclick="filterServer('all')">Усі сервери</button>
          <button class="server-filter-btn" id="filterMy" onclick="filterServer('my')">Мій сервер</button>
        </div>
      </div>

      <table class="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Модератор</th>
            <th>Сервер</th>
            <th>Час на зміні</th>
          </tr>
        </thead>
        <tbody id="lbTableBody">
          <tr><td colspan="4" style="text-align: center; color: #6e7681;">Завантаження лідерборду...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zhvhkbchztcqorocbngv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35';
    const dbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const currentUser = JSON.parse(localStorage.getItem('ugta_current_user'));
    if (!currentUser || !dbClient) {
      window.location.href = 'login.html';
    }

    const serverColors = {
      '01': '#FF7A00', '02': '#00B2FF', '03': '#10D03A',
      '04': '#8F22FF', '05': '#FF5E9D', '06': '#00E5C4', '07': '#3B82F6'
    };

    function getServerLogoHTML(serverNum) {
      const numStr = String(serverNum || '05').padStart(2, '0');
      const bg = serverColors[numStr] || serverColors['05'];
      return `<div class="server-badge" style="background-color: ${bg};">${numStr}</div>`;
    }

    let isOnShift = false;
    let timerInterval = null;
    let shiftStartTime = null;
    let totalSecondsToday = 0;

    let currentPeriod = 'day';
    let currentServerFilter = 'all';
    let allShiftsData = [];

    const todayStr = new Date().toISOString().split('T')[0];
    const yDayObj = new Date(); yDayObj.setDate(yDayObj.getDate() - 1);
    const yesterdayStr = yDayObj.toISOString().split('T')[0];

    document.getElementById('todayDate').textContent = todayStr;
    document.getElementById('yesterdayDate').textContent = yesterdayStr;

    // Ініціалізація профілю
    if (currentUser) {
      document.getElementById('userNick').textContent = currentUser.nick || 'Модератор';
      const roleElem = document.getElementById('userRole');
      const rawRole = (currentUser.role || 'S.M').toUpperCase();
      roleElem.textContent = currentUser.role || 'S.M';
      
      roleElem.className = 'role-badge ';
      if (rawRole.includes('MODERATOR') || rawRole.includes('МОДЕРАТОР')) roleElem.classList.add('role-moderator');
      else if (rawRole.includes('ЗКТП')) roleElem.classList.add('role-zktp');
      else if (rawRole.includes('КТП')) roleElem.classList.add('role-ktp');
      else roleElem.classList.add('role-sm');

      document.getElementById('userServerContainer').innerHTML = getServerLogoHTML(currentUser.server);
    }

    // Завантаження даних із бази при старті
    async function initData() {
      await fetchShifts();
      setupRealtimeSubscription();
    }

    async function fetchShifts() {
      const { data, error } = await dbClient.from('shifts').select('*, profiles(nick, server, role)');
      if (!error && data) {
        allShiftsData = data;
        updateUIWithShifts();
      }
    }

    // Реагування на події в реальному часі
    function setupRealtimeSubscription() {
      dbClient.channel('public:shifts')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'shifts' }, payload => {
          fetchShifts();
        })
        .subscribe();
    }

    function switchTab(tab) {
      document.getElementById('mainSection').style.display = tab === 'main' ? 'block' : 'none';
      document.getElementById('leaderboardSection').style.display = tab === 'leaderboard' ? 'block' : 'none';
      document.getElementById('btnMain').classList.toggle('active', tab === 'main');
      document.getElementById('btnLeaderboard').classList.toggle('active', tab === 'leaderboard');
    }

    async function toggleShift() {
      const statusInd = document.getElementById('statusIndicator');
      const shiftBtn = document.getElementById('shiftBtn');

      isOnShift = !isOnShift;

      if (isOnShift) {
        statusInd.textContent = 'На зміні';
        statusInd.className = 'status-on';
        shiftBtn.textContent = 'Завершити зміну';
        shiftBtn.classList.add('active');
        shiftStartTime = new Date();

        timerInterval = setInterval(() => {
          totalSecondsToday++;
          document.getElementById('todayTimer').textContent = formatTime(totalSecondsToday);
        }, 1000);

      } else {
        statusInd.textContent = 'Не на зміні';
        statusInd.className = 'status-off';
        shiftBtn.textContent = 'Почати зміну';
        shiftBtn.classList.remove('active');
        clearInterval(timerInterval);

        if (totalSecondsToday > 0) {
          await saveShiftToDB(shiftStartTime, new Date(), totalSecondsToday);
        }
      }
    }

    async function saveShiftToDB(start, end, durationSec) {
      const shiftRecord = {
        user_id: currentUser.id,
        date: todayStr,
        start_time: start.toTimeString().split(' ')[0],
        end_time: end.toTimeString().split(' ')[0],
        duration_seconds: durationSec
      };

      await dbClient.from('shifts').insert([shiftRecord]);
      await fetchShifts();
    }

    function formatTime(sec) {
      const hrs = String(Math.floor(sec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const secs = String(sec % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function updateUIWithShifts() {
      // 1. Оновлення списку особистих змін та таймерів
      const myShifts = allShiftsData.filter(s => s.user_id === currentUser.id);
      
      let todaySecs = 0;
      let yesterdaySecs = 0;
      let recentListHTML = '';

      myShifts.sort((a, b) => new Date(b.created_at || b.date) - new Date(a.created_at || a.date));

      myShifts.forEach(s => {
        if (s.date === todayStr) todaySecs += s.duration_seconds;
        if (s.date === yesterdayStr) yesterdaySecs += s.duration_seconds;

        recentListHTML += `
          <div class="shift-item">
            <div>
              <strong>Зміна (${s.date})</strong>
              <div class="shift-time">${s.start_time || '00:00'} — ${s.end_time || '00:00'}</div>
            </div>
            <div class="shift-duration">+ ${formatTime(s.duration_seconds)}</div>
          </div>
        `;
      });

      if (!isOnShift) {
        totalSecondsToday = todaySecs;
        document.getElementById('todayTimer').textContent = formatTime(todaySecs);
      }
      document.getElementById('yesterdayTimer').textContent = formatTime(yesterdaySecs);
      document.getElementById('shiftsList').innerHTML = recentListHTML || `<div style="color: #6e7681; font-size: 13px;">Немає завершених змін.</div>`;

      renderLeaderboard();
    }

    function setPeriod(index, period) {
      document.getElementById('sliderPill').style.transform = `translateX(${index * 100}%)`;
      document.querySelectorAll('.sliding-toggle .toggle-btn').forEach((btn, i) => btn.classList.toggle('active', i === index));
      currentPeriod = period;
      renderLeaderboard();
    }

    function filterServer(type) {
      currentServerFilter = type;
      document.getElementById('filterAll').classList.toggle('active', type === 'all');
      document.getElementById('filterMy').classList.toggle('active', type === 'my');
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('lbTableBody');
      const now = new Date();
      const currentMonth = now.toISOString().slice(0, 7); // формат "YYYY-MM"
      const currentWeekNum = getWeekNumber(now);

      // Групуємо зміни по користувачах відповідно до обраного періоду
      const statsMap = {};

      allShiftsData.forEach(shift => {
        if (!shift.profiles) return;
        
        const shiftDate = new Date(shift.date);
        const shiftMonth = shift.date.slice(0, 7);
        const shiftWeekNum = getWeekNumber(shiftDate);

        let include = false;
        if (currentPeriod === 'day' && shift.date === todayStr) include = true;
        if (currentPeriod === 'week' && shiftWeekNum === currentWeekNum && shiftDate.getFullYear() === now.getFullYear()) include = true;
        
        // ПЕРШЕ ЧИСЛО МІСЯЦЯ: фільтруємо виключно поточний місяць. 
        // Як тільки настає 1-ше число, shiftMonth змінюється, старі дані місяця не потрапляють сюди автоматично.
        if (currentPeriod === 'month' && shiftMonth === currentMonth) include = true;

        if (include) {
          const uid = shift.user_id;
          if (!statsMap[uid]) {
            statsMap[uid] = {
              nick: shift.profiles.nick,
              server: shift.profiles.server,
              totalSec: 0
            };
          }
          statsMap[uid].totalSec += shift.duration_seconds;
        }
      });

      let lbArray = Object.values(statsMap);

      if (currentServerFilter === 'my') {
        const userSrv = String(currentUser.server || '05').padStart(2, '0');
        lbArray = lbArray.filter(item => String(item.server).padStart(2, '0') === userSrv);
      }

      lbArray.sort((a, b) => b.totalSec - a.totalSec);

      if (lbArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #6e7681;">Немає даних за цей період</td></tr>`;
        return;
      }

      tbody.innerHTML = lbArray.map((item, index) => {
        let rankSymbol = index + 1;
        if (index === 0) rankSymbol = '🥇';
        else if (index === 1) rankSymbol = '🥈';
        else if (index === 2) rankSymbol = '🥉';

        return `
          <tr>
            <td><span class="rank-badge">${rankSymbol}</span></td>
            <td><strong>${item.nick}</strong></td>
            <td>${getServerLogoHTML(item.server)}</td>
            <td style="font-family: monospace; font-weight: 600;">${formatTime(item.totalSec)}</td>
          </tr>
        `;
      }).join('');
    }

    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.DATE || d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
      var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
      return weekNo;
    }

    document.getElementById('profileBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('active');
    });

    document.addEventListener('click', () => {
      document.getElementById('profileDropdown').classList.remove('active');
    });

    function logout() {
      localStorage.removeItem('ugta_current_user');
      window.location.href = 'login.html';
    }

    // Запуск підвантаження даних
    initData();
  </script>
</body>
</html>
