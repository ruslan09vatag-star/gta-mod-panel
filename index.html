<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>UGTA Moderation Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0b0e14; color: #fff; font-family: sans-serif; padding: 20px; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; }
    button { padding: 10px 20px; background: #1f6feb; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
    .card { background: #121721; padding: 20px; border-radius: 12px; border: 1px solid #1e2638; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="nav">
    <button onclick="showSection('panel')">Панель</button>
    <button onclick="showSection('leaderboard')">Лідерборд</button>
    <button onclick="logout()">Вийти</button>
  </div>

  <div id="panel" class="card">
    <h1>Особистий кабінет</h1>
    <div id="userInfo">Завантаження даних...</div>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #1e2638;">
    <h3>Здати зміну</h3>
    <input type="number" id="shiftDuration" placeholder="Час у хвилинах" style="padding:10px; border-radius:6px; border:none;">
    <button onclick="submitShift()">Відправити</button>
  </div>

  <div id="leaderboard" class="card" style="display:none;">
    <h1>Лідерборд</h1>
    <div id="lbData">Дані лідерборду...</div>
  </div>

  <script>
    const dbClient = supabase.createClient('https://zhvhkbchztcqorocbngv.supabase.co', 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35');

    // Перевірка авторизації
    const currentUser = JSON.parse(localStorage.getItem('ugta_current_user'));
    if (!currentUser) window.location.href = 'login.html';
    
    document.getElementById('userInfo').innerHTML = `Вітаємо, <b>${currentUser.nick}</b>! Акаунт: ${currentUser.account_number}`;

    function showSection(id) {
      document.getElementById('panel').style.display = id === 'panel' ? 'block' : 'none';
      document.getElementById('leaderboard').style.display = id === 'leaderboard' ? 'block' : 'none';
    }

    async function submitShift() {
      const duration = document.getElementById('shiftDuration').value;
      const { error } = await dbClient.from('shifts').insert([{ user_id: currentUser.id, duration_seconds: duration * 60, date: new Date().toISOString().split('T')[0] }]);
      if (error) alert('Помилка!');
      else alert('Зміну здано!');
    }

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
