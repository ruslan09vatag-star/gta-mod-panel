<script>
  // 1. Дані Supabase
  const SUPABASE_URL = 'https://zhvhkbchztcqorocbngv.supabase.co';
  const SUPABASE_KEY = 'ВАШ_SUPABASE_ANON_KEY'; // Поставте свій ключ сюди!
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loginForm = document.getElementById('loginForm');
  const errorMessage = document.getElementById('errorMessage');

  // 2. Обробка натискання кнопки
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMessage.style.display = 'none';

    const accountNumber = document.getElementById('accountNumber').value.trim();
    const password = document.getElementById('password').value.trim();

    // Запит до бази Supabase
    const { data: user, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('account_number', accountNumber)
      .eq('password', password)
      .maybeSingle();

    if (error) {
      console.error('Помилка:', error);
      showError('❌ Помилка з\'єднання з базою даних.');
      return;
    }

    if (!user) {
      showError('❌ Невірний номер акаунта або пароль!');
      return;
    }

    // Якщо все правильно
    localStorage.setItem('userSession', JSON.stringify(user));
    alert(`Ласкаво просимо, ${user.nick}!`);
    window.location.href = '/dashboard.html'; // Вкажіть потрібну сторінку
  });

  function showError(msg) {
    errorMessage.textContent = msg;
    errorMessage.style.display = 'block';
  }
</script>
