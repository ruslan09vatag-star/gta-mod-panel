<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Авторизація</title>
  <!-- Підключення Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-card">
    <h2>Авторизація</h2>

    <form id="loginForm">
      <div class="input-group">
        <label for="accountNumber">Номер акаунта</label>
        <input 
          type="text" 
          id="accountNumber" 
          placeholder="Введіть номер акаунта" 
          required 
        />
      </div>

      <div class="input-group">
        <label for="password">Пароль</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Введіть пароль" 
          required 
        />
      </div>

      <button type="submit" id="loginBtn">Увійти</button>
    </form>
  </div>

  <!-- Підключаємо ваш JS файл -->
  <script src="script.js"></script>
</body>
</html>
