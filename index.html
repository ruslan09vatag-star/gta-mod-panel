<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель модератора — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; padding: 20px; }
    .main-container { max-width: 1100px; margin: 0 auto; }
    
    .header-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    
    h1 { color: #fff; font-size: 26px; font-weight: 700; }
    
    .nav-links { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav-link { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600; transition: 0.2s; cursor: pointer; display: inline-block; }
    .nav-link:hover { color: #fff; background: #1f293d; }
    .nav-link.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

    .card { background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); margin-bottom: 20px; }
    .section-title { color: #fff; font-size: 18px; font-weight: 600; margin-bottom: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; color: #8b949e; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; background: #161b22; border: 1px solid #30363d; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    .form-input:focus, .form-select:focus { border-color: #1f6feb; }
    
    .action-btn { background: #238636; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; width: 100%; }
    .action-btn:hover { background: #2ea043; }

    /* Стилі для профілю та налаштувань */
    .user-profile-card { display: flex; align-items: center; justify-content: space-between; background: #121721; border: 1px solid #1e2638; border-radius: 12px; padding: 15px 20px; margin-bottom: 20px; }
    .user-info { display: flex; align-items: center; gap: 15px; }
    .user-avatar-large { width: 48px; height: 48px; border-radius: 50%; background: #21262d; border: 1px solid #30363d; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 18px; }
    .user-details h3 { color: #fff; font-size: 16px; margin-bottom: 3px; }
    .user-details span { color: #8b949e; font-size: 12px; }
    .settings-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .settings-btn:hover { background: #30363d; color: #fff; }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Навігація між панелями -->
    <div class="nav-links">
      <button class="nav-link active" onclick="window.location.href='index.html'">Панель модератора</button>
      <button class="nav-link" onclick="window.location.href='admin.html'">Панель керівництва</button>
      <button class="nav-link" onclick="window.location.href='leaderboard.html'">Лідерборд 🏆</button>
    </div>

    <!-- Блок профілю користувача з аватаркою та налаштуваннями -->
    <div class="user-profile-card">
      <div class="user-info">
        <div class="user-avatar-large" id="userAvatarLetter">Р</div>
        <div class="user-details">
          <h3 id="profileNickName">Руслан</h3>
          <span id="profileRoleText">Модератор • Сервер 01</span>
        </div>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️ Налаштування</button>
    </div>

    <div class="header-section">
      <h1>Панель модератора</h1>
    </div>

    <div class="card">
      <div class="section-title">Керування останньою зміною</div>
      <div class="form-group">
        <label class="form-label">Нікнейм модератора</label>
        <input type="text" id="nickInput" class="form-input" placeholder="Введіть нік..." value="Руслан">
      </div>
      <div class="form-group">
        <label class="form-label">Вибрати сервер</label>
        <select id="serverSelect" class="form-select">
          <option value="1">Сервер 01</option>
          <option value="2">Сервер 02</option>
          <option value="3">Сервер 03</option>
          <option value="4">Сервер 04</option>
          <option value="5">Сервер 05</option>
          <option value="6">Сервер 06</option>
          <option value="7">Сервер 07</option>
        </select>
      </div>
      <button class="action-btn" onclick="toggleShift()">Розпочати / Завершити зміну</button>
    </div>
  </div>

  <script type="module">
    window.toggleShift = function() {
      const nick = document.getElementById('nickInput').value;
      const server = document.getElementById('serverSelect').value;
      if (!nick) {
        alert("Будь ласка, введіть нікнейм!");
        return;
      }
      alert(`Зміну для ${nick} на сервері 0${server} успішно оновлено!`);
    }

    window.openSettings = function() {
      alert("Відкриття налаштувань (зміна пароля, аватара тощо)...");
    }
  </script>
</body>
</html>
