<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель модерації — UGTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0e14; color: #c9d1d9; min-height: 100vh; padding: 15px; }
    .main-container { max-width: 1200px; margin: 0 auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #121721; border: 1px solid #1e2638; padding: 12px 16px; border-radius: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    
    /* Випадаюче меню профілю */
    .user-profile-wrapper { position: relative; display: inline-block; cursor: pointer; padding-bottom: 5px; margin-bottom: -5px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .user-avatar { background: linear-gradient(135deg, #1f6feb, #1158c7); color: #fff; font-weight: 700; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 18px; flex-shrink: 0; box-shadow: 0 2px 10px rgba(31,111,235,0.3); background-size: cover; background-position: center; }
    .user-details { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .user-name { font-weight: 600; color: #fff; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role-badge { background: #1f293d; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; border: 1px solid #30363d; display: inline-block; width: fit-content; }
    
    .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #161b22; border: 1px solid #30363d; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); min-width: 160px; z-index: 100; padding-top: 5px; overflow: hidden; }
    .user-profile-wrapper:hover .dropdown-menu { display: block; }
    .dropdown-item { padding: 10px 14px; color: #c9d1d9; font-size: 13px; font-weight: 500; text-decoration: none; display: block; transition: 0.2s; cursor: pointer; background: none; border: none; width: 100%; text-align: left; }
    .dropdown-item:hover { background: #1f6feb; color: #fff; }

    .nav-links { display: flex; gap: 6px; align-items: center; width: 100%; justify-content: flex-start; flex-wrap: wrap; }
    .nav-btn { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none; transition: 0.2s; flex-grow: 1; text-align: center; }
    .nav-btn:hover, .nav-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    .logout-btn { background: #da3633 !important; border-color: #f85149 !important; flex-grow: 0 !important; width: 100%; }

    h1 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 15px; }
    
    .status-card { background: #121721; border: 1px solid #1e2638; padding: 18px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .status-text { font-size: 15px; font-weight: 500; text-align: center; }
    .status-badge { font-weight: 700; }
    .status-badge.off { color: #f85149; }
    .status-badge.on { color: #3fb950; }

    .action-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; color: #fff; text-align: center; }
    .btn-start { background-color: #238636; }
    .btn-start:hover { background-color: #2ea043; }
    .btn-end { background-color: #da3633; }
    .btn-end:hover { background-color: #e5534b; }
    .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .stats-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
    .stat-box { background: #121721; border: 1px solid #1e2638; padding: 18px; border-radius: 12px; }
    .stat-title { color: #8b949e; font-size: 13px; margin-bottom: 4px; }
    .stat-date { color: #8b949e; font-size: 11px; margin-bottom: 8px; }
    .stat-time { font-size: 24px; font-weight: 700; color: #fff; font-family: monospace; }

    .section-title { color: #fff; font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { background: #121721; border: 1px solid #1e2638; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; flex-wrap: wrap; gap: 5px; }
    .history-date { color: #8b949e; font-size: 12px; }
    .history-duration { font-weight: 600; color: #3fb950; font-family: monospace; }

    /* Модальне вікно налаштувань */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-card { background: #121721; border: 1px solid #30363d; border-radius: 14px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; }
    .modal-title { color: #fff; font-size: 18px; font-weight: 700; }
    .modal-input-group { display: flex; flex-direction: column; gap: 6px; }
    .modal-label { font-size: 12px; color: #8b949e; font-weight: 500; }
    .modal-input { background: #0b0e14; border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none; }
    .modal-input:focus { border-color: #1f6feb; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 5px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; text-align: center; }
    .btn-save { background: #238636; color: #fff; }
    .btn-save:hover { background: #2ea043; }
    .btn-cancel { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-cancel:hover { background: #30363d; }

    @media(min-width: 768px) {
      body { padding: 30px; }
      .top-bar { padding: 14px 24px; flex-wrap: nowrap; }
      .user-profile-wrapper { width: auto; }
      .nav-links { width: auto; flex-wrap: nowrap; }
      .nav-btn { width: auto; flex-grow: 0; }
      .logout-btn { width: auto; }
      h1 { font-size: 26px; }
      .status-card { flex-direction: row; justify-content: space-between; align-items: center; padding: 24px; }
      .status-text { text-align: left; }
      .action-btn { width: auto; padding: 12px 24px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
      .stat-box { padding: 24px; }
      .stat-time { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="top-bar">
      <!-- Випадаюче меню профілю -->
      <div class="user-profile-wrapper">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">Р</div>
          <div class="user-details">
            <div class="user-name" id="userName">Завантаження...</div>
            <div class="user-role-badge" id="userRoleBadge">Завантаження...</div>
          </div>
        </div>
        <div class="dropdown-menu">
          <button class="dropdown-item" onclick="openSettingsModal()">Налаштування</button>
        </div>
      </div>

      <div class="nav-links">
        <a href="index.html" class="nav-btn active">Панель</a>
        <a href="leaderboard.html" class="nav-btn">Лідерборд</a>
        <a href="#" class="nav-btn logout-btn" onclick="logout()">Вийти</a>
      </div>
    </div>

    <h1>Панель модерації</h1>

    <div class="status-card">
      <div class="status-text">
        Статус: <span id="statusBadge" class="status-badge off">Не на зміні</span>
      </div>
      <button id="shiftToggleBtn" class="action-btn btn-start" onclick="toggleShift()">Почати зміну</button>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-title">Сьогодні</div>
        <div class="stat-date" id="todayDate">----.--.--</div>
        <div class="stat-time" id="todayTime">00:00:00</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Вчора</div>
        <div class="stat-date" id="yesterdayDate">----.--.--</div>
        <div class="stat-time" id="yesterdayTime">00:00:00</div>
      </div>
    </div>

    <div class="section-title">Останні зміни</div>
    <div class="history-list" id="historyList">
      <div style="color: #8b949e; font-size: 14px;">Завантаження історії...</div>
    </div>
  </div>

  <!-- Модальне вікно налаштувань -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-title">Налаштування профілю</div>
      
      <div class="modal-input-group">
        <label class="modal-label">Вибрати аватарку з комп'ютера</label>
        <input type="file" id="avatarFile" class="modal-input" accept="image/*" style="padding: 7px; cursor: pointer;">
      </div>

      <div class="modal-input-group">
        <label class="modal-label">Новий пароль (залиште порожнім, якщо не міняєте)</label>
        <input type="password" id="passwordInput" class="modal-input" placeholder="Введіть новий пароль">
      </div>

      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeSettingsModal()">Скасувати</button>
        <button class="modal-btn btn-save" onclick="saveSettings()">Зберегти</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { getAllShifts, saveShift, getRoleColor } from './data.js';

    let currentUser = JSON.parse(localStorage.getItem('ugta_current_user') || 'null');
    if (!currentUser) { window.location.href = 'login.html'; }

    const nick = currentUser.nick || 'Користувач';
    const server = currentUser.server || '02';
    const role = currentUser.role || currentUser.status || 'Модератор';

    document.getElementById('userName').textContent = nick;
    
    // Завантаження аватарки з localStorage
    const avatarEl = document.getElementById('userAvatar');
    const savedAvatar = localStorage.getItem('ugta_avatar_' + nick) || currentUser.avatar;
    if (savedAvatar) {
      avatarEl.style.backgroundImage = `url('${savedAvatar}')`;
      avatarEl.textContent = '';
    } else {
      avatarEl.textContent = nick.charAt(0).toUpperCase();
    }
    
    const roleBadge = document.getElementById('userRoleBadge');
    roleBadge.textContent = `${role} • Сервер ${server}`;
    roleBadge.style.color = getRoleColor(role);

    const now = new Date();
    const todayStr = now.toISOString().split('T')[0];
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];

    document.getElementById('todayDate').textContent = todayStr;
    document.getElementById('yesterdayDate').textContent = yesterdayStr;

    let isOnDuty = localStorage.getItem('ugta_is_on_duty_' + nick) === 'true';
    let shiftStartTime = parseInt(localStorage.getItem('ugta_shift_start_' + nick) || '0');

    const statusBadge = document.getElementById('statusBadge');
    const shiftToggleBtn = document.getElementById('shiftToggleBtn');

    function updateShiftUI() {
      if (isOnDuty) {
        statusBadge.textContent = 'На зміні';
        statusBadge.className = 'status-badge on';
        shiftToggleBtn.textContent = 'Закінчити зміну';
        shiftToggleBtn.className = 'action-btn btn-end';
      } else {
        statusBadge.textContent = 'Не на зміні';
        statusBadge.className = 'status-badge off';
        shiftToggleBtn.textContent = 'Почати зміну';
        shiftToggleBtn.className = 'action-btn btn-start';
      }
    }
    updateShiftUI();

    window.toggleShift = async function() {
      const currentTime = Date.now();
      if (!isOnDuty) {
        isOnDuty = true;
        shiftStartTime = currentTime;
        localStorage.setItem('ugta_is_on_duty_' + nick, 'true');
        localStorage.setItem('ugta_shift_start_' + nick, shiftStartTime);
        updateShiftUI();
      } else {
        const durationSec = Math.max(1, Math.floor((currentTime - shiftStartTime) / 1000));
        
        shiftToggleBtn.disabled = true;
        shiftToggleBtn.textContent = 'Збереження...';

        let isSaved = false;
        const safetyTimeout = setTimeout(() => {
          if (!isSaved) {
            shiftToggleBtn.disabled = false;
            loadShiftsHistory();
          }
        }, 5000);

        try {
          await saveShift({
            nick: nick,
            server: server,
            role: role,
            date: todayStr,
            duration_seconds: durationSec
          });
          isSaved = true;
        } catch (error) {
          console.error("Помилка збереження зміни:", error);
        } finally {
          isOnDuty = false;
          shiftStartTime = 0;
          localStorage.removeItem('ugta_is_on_duty_' + nick);
          localStorage.removeItem('ugta_shift_start_' + nick);
          
          clearTimeout(safetyTimeout);
          shiftToggleBtn.disabled = false;
          
          updateShiftUI();
          loadShiftsHistory();
        }
      }
    }

    async function loadShiftsHistory() {
      const allData = await getAllShifts();
      const shifts = allData.filter(s => s.nick && s.nick.toLowerCase() === nick.toLowerCase());
      
      const historyList = document.getElementById('historyList');
      if (shifts.length === 0) { 
        historyList.innerHTML = `<div style="color: #8b949e; font-size: 13px;">Ще немає завершених змін.</div>`; 
      } else {
        historyList.innerHTML = shifts.slice(0, 10).map(shift => {
          const h = Math.floor(shift.duration_seconds / 3600);
          const m = Math.floor((shift.duration_seconds % 3600) / 60);
          const s = shift.duration_seconds % 60;
          return `<div class="history-item"><span class="history-date">Дата: <b>${shift.date}</b></span><span class="history-duration">${h}г ${m}хв ${s}с</span></div>`;
        }).join('');
      }

      let todayTotalSec = 0;
      let yesterdayTotalSec = 0;
      shifts.forEach(s => {
        if (s.date === todayStr) todayTotalSec += s.duration_seconds;
        if (s.date === yesterdayStr) yesterdayTotalSec += s.duration_seconds;
      });

      if (isOnDuty && shiftStartTime > 0) { 
        todayTotalSec += Math.floor((Date.now() - shiftStartTime) / 1000); 
      }

      document.getElementById('todayTime').textContent = formatTime(todayTotalSec);
      document.getElementById('yesterdayTime').textContent = formatTime(yesterdayTotalSec);
    }

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Модальне вікно налаштувань
    window.openSettingsModal = function() {
      document.getElementById('settingsModal').style.display = 'flex';
      document.getElementById('avatarFile').value = '';
      document.getElementById('passwordInput').value = '';
    }

    window.closeSettingsModal = function() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    window.saveSettings = function() {
      const fileInput = document.getElementById('avatarFile');
      const newPassword = document.getElementById('passwordInput').value.trim();

      const applyChanges = (avatarData) => {
        if (avatarData !== undefined) {
          if (avatarData) {
            localStorage.setItem('ugta_avatar_' + nick, avatarData);
            avatarEl.style.backgroundImage = `url('${avatarData}')`;
            avatarEl.textContent = '';
          } else {
            localStorage.removeItem('ugta_avatar_' + nick);
            avatarEl.style.backgroundImage = 'none';
            avatarEl.textContent = nick.charAt(0).toUpperCase();
          }
        }

        if (newPassword) {
          // 1. Оновлюємо поточну сесію
          currentUser.password = newPassword;
          localStorage.setItem('ugta_current_user', JSON.stringify(currentUser));

          // 2. Оновлюємо в загальному сховищі користувачів, якщо воно використовується
          let allUsers = JSON.parse(localStorage.getItem('ugta_users') || '[]');
          const userIndex = allUsers.findIndex(u => u.nick && u.nick.toLowerCase() === nick.toLowerCase());
          if (userIndex !== -1) {
            allUsers[userIndex].password = newPassword;
            localStorage.setItem('ugta_users', JSON.stringify(allUsers));
          }

          alert('Пароль та налаштування успішно збережено!');
        } else {
          alert('Налаштування успішно збережено!');
        }

        closeSettingsModal();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          applyChanges(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        applyChanges(undefined);
      }
    }

    window.logout = function() { 
      localStorage.removeItem('ugta_current_user');
      window.location.href = 'login.html'; 
    }

    loadShiftsHistory();
    setInterval(() => { if (isOnDuty) loadShiftsHistory(); }, 1000);
  </script> 
</body>
</html>
