<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — UGTA Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
    .box { background: #121721; padding: 30px; border-radius: 12px; width: 320px; border: 1px solid #1e2638; }
    h2 { margin-bottom: 20px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #0b0e14; border: 1px solid #1e2638; color: #fff; border-radius: 6px; box-sizing: border-box; }
    .check-container { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #8b949e; cursor: pointer; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background: #1f6feb; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #388bfd; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Вхід</h2>
    <input type="text" id="acc" placeholder="Номер акаунта">
    <input type="password" id="pass" placeholder="Пароль">
    
    <label class="check-container">
      <input type="checkbox" id="rememberMe"> Запам'ятати мене
    </label>

    <button onclick="handleLogin()">Увійти</button>
  </div>

  <script>
    const dbClient = supabase.createClient('https://zhvhkbchztcqorocbngv.supabase.co', 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35');

    // Перевірка при завантаженні (якщо "запам'ятали")
    window.onload = () => {
      if (localStorage.getItem('ugta_remember_me') === 'true' && localStorage.getItem('ugta_current_user')) {
        window.location.href = 'index.html';
      }
    };

    async function handleLogin() {
      const acc = document.getElementById('acc').value;
      const pass = document.getElementById('pass').value;
      const remember = document.getElementById('rememberMe').checked;

      const { data: user } = await dbClient.from('profiles').select('*').eq('account_number', acc).eq('password', pass).maybeSingle();

      if (user) {
        localStorage.setItem('ugta_current_user', JSON.stringify(user));
        localStorage.setItem('ugta_remember_me', remember ? 'true' : 'false');
        window.location.href = 'index.html';
      } else {
        alert('Невірні дані!');
      }
    }
  </script>
</body>
</html>
