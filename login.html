<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід — Панель модерації</title>
  <style>
    body { background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
    .card { background: #121721; padding: 30px; border-radius: 12px; width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #30363d; background: #0b0e14; color: #fff; }
    button { width: 100%; padding: 10px; background: #238636; border: none; color: #fff; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Вхід</h2>
    <input type="text" id="nick" placeholder="Ваш нікнейм">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="login()">Увійти</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = supabase.createClient('ВАШ_URL_SUPABASE', 'ВАШ_KEY_SUPABASE');
    async function login() {
      const nick = document.getElementById('nick').value.trim();
      const password = document.getElementById('password').value.trim();
      
      const { data, error } = await supabase.from('profiles').select('*').eq('nick', nick).eq('password', password).single();
      
      if (data) {
        localStorage.setItem('ugta_current_user', JSON.stringify(data));
        window.location.href = 'index.html';
      } else {
        alert('Невірний нікнейм або пароль!');
      }
    }
  </script>
</body>
</html>
