<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — Панель модерації</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { 
      background: #0b0e14; 
      color: #c9d1d9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
    }
    .card { 
      background: #121721; 
      padding: 35px 30px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 380px; 
      border: 1px solid #1e2638; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
      text-align: center;
    }
    .logo-container { margin-bottom: 20px; }
    
    /* Стиль для текстового логотипу */
    .gta-logo-text {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #33b5e5 0%, #0099cc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(0, 153, 204, 0.3);
      margin-bottom: 4px;
    }

    .panel-subtitle { color: #8b949e; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 25px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    .input-label { display: block; font-size: 12px; font-weight: 500; color: #8b949e; margin-bottom: 6px; }
    input[type="text"], input[type="password"] { 
      width: 100%; padding: 12px 14px; border-radius: 8px; 
      border: 1px solid #30363d; background: #0b0e14; color: #fff; 
      font-size: 14px; outline: none; transition: 0.2s; 
    }
    input:focus { border-color: #1f6feb; box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15); }
    
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 6px;
      text-align: left;
    }
    .checkbox-container input {
      width: 16px;
      height: 16px;
      accent-color: #238636;
      cursor: pointer;
    }
    .checkbox-container label {
      font-size: 13px;
      color: #8b949e;
      cursor: pointer;
      user-select: none;
    }

    button { 
      width: 100%; padding: 12px; background: #238636; border: none; 
      color: #fff; border-radius: 8px; cursor: pointer; font-size: 15px; 
      font-weight: 600; margin-top: 14px; transition: 0.2s; 
    }
    button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="gta-logo-text">UKRAINE GTA</div>
      <div class="panel-subtitle">Moderation Panel</div>
    </div>

    <div class="input-group">
      <label class="input-label">Нікнейм</label>
      <input type="text" id="nick" placeholder="Введіть ваш нікнейм">
    </div>

    <div class="input-group">
      <label class="input-label">Пароль</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="rememberMe">
      <label for="rememberMe">Запам'ятати мене</label>
    </div>

    <button onclick="handleLogin()">Увійти в систему</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _supabase = supabase.createClient('https://zhvhkbchztcqorocbngv.supabase.co', 'sb_publishable_pv6F4MnwE7AUowAOVddI3A_8TNfwm35');

    window.addEventListener('DOMContentLoaded', () => {
      const savedNick = localStorage.getItem('ugta_saved_nick');
      if (savedNick) {
        document.getElementById('nick').value = savedNick;
        document.getElementById('rememberMe').checked = true;
      }
    });

    async function handleLogin() {
      const nick = document.getElementById('nick').value.trim();
      const password = document.getElementById('password').value.trim();
      const rememberMe = document.getElementById('rememberMe').checked;
      
      if (!nick || !password) {
        alert('Будь ласка, заповніть усі поля!');
        return;
      }

      const { data, error } = await _supabase
        .from('profiles')
        .select('*')
        .eq('nick', nick)
        .eq('password', password)
        .single();
      
      if (data) {
        localStorage.setItem('ugta_current_user', JSON.stringify(data));
        
        if (rememberMe) {
          localStorage.setItem('ugta_saved_nick', nick);
        } else {
          localStorage.removeItem('ugta_saved_nick');
        }

        window.location.href = 'index.html';
      } else {
        alert('Невірний нікнейм або пароль!');
      }
    }
  </script>
</body>
</html>
