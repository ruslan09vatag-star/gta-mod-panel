<script type="module">
    import { subscribeToShifts, getRoleColor } from './data.js';

    let currentUser = JSON.parse(localStorage.getItem('ugta_current_user') || 'null');
    if (!currentUser) {
      window.location.href = 'login.html';
    }

    // Перевірка ролей керівництва
    const role = (currentUser.role || currentUser.status || '').toUpperCase();
    const privilegedRoles = ['S.M', 'ЗКТП', 'КТП', 'АДМІНІСТРАТОР', 'КУРАТОР', 'ЗАСНОВНИК', 'КЕРІВНИК', 'ГАЛ. АДМІНІСТРАТОР', 'ГОЛОВНИЙ АДМІНІСТРАТОР', 'СТАРШИЙ МОДЕРАТОР'];
    const hasAccess = privilegedRoles.some(r => role.includes(r));
    
    if (!hasAccess) {
      alert('Доступ заборонено! Ця сторінка тільки для керівництва.');
      window.location.href = 'index.html';
    }

    const now = new Date();
    document.getElementById('currentDateBadge').textContent = `📅 ${now.toLocaleDateString('uk-UA')}`;

    // Підписка в реальному часі на зміни з Firebase
    subscribeToShifts((allShifts) => {
      document.getElementById('totalShiftsCount').textContent = allShifts.length;

      // Середній час зміни
      if (allShifts.length > 0) {
        const totalSecs = allShifts.reduce((acc, s) => acc + (s.duration_seconds || 0), 0);
        const avgSecs = Math.floor(totalSecs / allShifts.length);
        const hrs = Math.floor(avgSecs / 3600);
        const mins = Math.floor((avgSecs % 3600) / 60);
        document.getElementById('avgShiftTime').textContent = `${hrs}:${String(mins).padStart(2, '0')}`;
      }

      // Фільтруємо тих, хто зараз на зміні з Firebase (шляхом перевірки активних полів або статусів)
      // Або якщо у вас зберігаються документи активних сесій. 
      // Якщо у вас записується тільки завершена зміна через saveShift, то рядок "онлайн" треба писати в окрему колекцію "ugta_online".
      // Але поки що для виправлення виведемо список останніх активних або тих, у кого статус active:
      
      const onlineList = allShifts.filter(s => s.status === 'active' || s.isOnDuty === true);

      document.getElementById('onlineCount').textContent = onlineList.length;
      const tableBody = document.getElementById('onlineUsersTableBody');

      if (onlineList.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8b949e; padding: 20px;">Зараз немає активних модераторів на зміні.</td></tr>`;
        return;
      }

      tableBody.innerHTML = onlineList.map(item => {
        const avatarStyle = item.avatar ? `background-image: url('${item.avatar}');` : '';
        const avatarText = item.avatar ? '' : (item.nick || 'М').charAt(0).toUpperCase();

        return `
          <tr>
            <td>
              <div class="user-cell">
                <div class="user-avatar-sm" style="${avatarStyle}">${avatarText}</div>
                ${item.nick || 'Користувач'}
              </div>
            </td>
            <td><span class="server-badge">${item.server || '02'}</span></td>
            <td>${item.startTimeStr || '--:--'}</td>
            <td style="font-family: monospace; color: #58a6ff; font-weight: 600;">Працює</td>
            <td><span class="status-online">Online</span></td>
          </tr>
        `;
      }).join('');
    });

    window.generateReport = function() { alert("Звіт успішно сформовано!"); }
    window.logout = function() {
      localStorage.removeItem('ugta_current_user');
      window.location.href = 'login.html';
    }
  </script>
